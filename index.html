<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>テトリスコーヒー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <section id="titleScreen" class="screen active">
      <div class="titleBox topBox">
        <img id="titleImage" src="title.png" class="titleImage" alt="テトリスコーヒー">
        <p class="ruleText">落として、崩して、混ぜろ！<br>カフェオレっぽさを競え！</p>
        <button id="startBtn" class="mainBtn">タップしてスタート</button>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <button id="backTitleBtn" class="backTitleBtn">タイトルへ戻る</button>

      <div class="topHud">
        <div>CAFE AU LAIT</div>
        <div><span id="countText">0</span>/20</div>
      </div>

      <canvas id="gameCanvas" width="240" height="360"></canvas>

      <div class="controls">
        <button id="leftBtn">◀</button>
        <button id="dropBtn">落下</button>
        <button id="rightBtn">▶</button>
      </div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="resultBox topBox">
        <h2 id="resultTitle">結果</h2>
        <canvas id="resultCanvas" width="240" height="180"></canvas>

        <p id="resultScore"></p>
        <p id="resultComment"></p>
        <p id="mixHint">ほどよいマーブル感が高評価のコツ！</p>

        <button id="shareBtn" class="mainBtn">Xでシェア</button>
        <button id="retryBtn" class="subBtn">もう1回遊ぶ</button>
        <button id="arcadeBtn" class="subBtn">カバゲーセンへ</button>
      </div>
    </section>
  </div>

  <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
  <audio id="fallSe" src="fall.mp3" preload="auto"></audio>

  <script src="game.js"></script>
</body>
</html>
